<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家計簿</title>
    <link rel="stylesheet" href="money.css">
</head>

<body>

    <header>
        <h1>家計簿</h1>

        <button id="logout-button" type="button">
            ログアウト
        </button>
    </header>

    <main>

        <section class="month-control">

            <button
                type="button"
                id="prev-month"
                class="month-button"
            >
                ← 前の月
            </button>

            <div class="month-display">
                <span id="current-month">
                    2026年8月
                </span>

                <button
                    type="button"
                    id="today-month"
                    class="today-button"
                >
                    今月
                </button>
            </div>

            <button
                type="button"
                id="next-month"
                class="month-button"
            >
                次の月 →
            </button>

        </section>


        <section class="total">

            <div>
                <span>💰 所持金</span>
                <strong id="totalmoney">
                    0円
                </strong>
            </div>

            <div>
                <span id="use-money-label">
                    💸 今月の使用金額
                </span>

                <strong id="usemoney">
                    0円
                </strong>
            </div>

            <div>
                <span>💴 現在の残金</span>

                <strong id="money-left">
                    0円
                </strong>
            </div>

        </section>


        <section class="form">

            <h2 class="title">
                所持金
            </h2>

            <form id="form">

                <input
                    type="number"
                    id="money-input"
                    placeholder="現在の所持金"
                    min="0"
                >

                <button type="submit">
                    設定
                </button>

            </form>


            <h2 class="title">
                使ったお金
            </h2>

            <form class="info">

                <div class="form-list">

                    <label for="trade-type">
                        ラベル
                    </label>

                    <select
                        id="trade-type"
                        class="form-input"
                    >

                        <option value="food">
                            食事
                        </option>

                        <option value="travel-cost">
                            移動費
                        </option>

                        <option value="house-money">
                            家賃
                        </option>

                        <option value="hang out">
                            遊び
                        </option>

                        <option value="other">
                            その他
                        </option>

                    </select>

                </div>


                <div class="form-list">

                    <label for="details">
                        内容
                    </label>

                    <input
                        type="text"
                        id="details"
                        class="form-input"
                        placeholder="詳細入力"
                    >

                </div>


                <div class="form-list">

                    <label for="amount">
                        金額
                    </label>

                    <input
                        type="number"
                        id="amount"
                        class="form-input"
                        placeholder="金額を入力"
                        min="0"
                    >

                </div>


                <div class="form-list">

                    <label for="date">
                        日付
                    </label>

                    <input
                        type="date"
                        id="date"
                        class="form-input"
                    >

                </div>


                <div class="button-group">

                    <button
                        class="form-button"
                        type="submit"
                    >
                        追加
                    </button>

                    <button
                        type="button"
                        id="delete-mode"
                        class="delete-button"
                    >
                        削除
                    </button>

                    <button
                        type="button"
                        id="edit-mode"
                        class="edit-button"
                    >
                        編集
                    </button>

                </div>

            </form>

        </section>


        <section class="history">

            <h2 class="title">
                <span id="history-title">
                    2026年8月の支出
                </span>
            </h2>

            <div id="money-list"></div>

        </section>


        <section class="edit-form" id="edit-section">

            <h2 class="title">
                明細を編集
            </h2>


            <div class="form-list">

                <label for="edit-details">
                    内容
                </label>

                <input
                    type="text"
                    id="edit-details"
                    class="form-input"
                >

            </div>


            <div class="form-list">

                <label for="edit-money">
                    金額
                </label>

                <input
                    type="number"
                    id="edit-money"
                    class="form-input"
                    min="0"
                >

            </div>


            <div class="form-list">

                <label for="edit-date">
                    日付
                </label>

                <input
                    type="date"
                    id="edit-date"
                    class="form-input"
                >

            </div>


            <div class="button-group">

                <button
                    type="button"
                    id="edit-save"
                    class="form-button"
                >
                    保存
                </button>

                <button
                    type="button"
                    id="edit-cancel"
                    class="delete-button"
                >
                    キャンセル
                </button>

            </div>

        </section>

    </main>


    <script src="money.js"></script>

</body>
</html>
